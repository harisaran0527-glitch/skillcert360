<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#082f49"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <rect
    x="16"
    y="16"
    width="480"
    height="480"
    rx="100"
    fill="none"
    stroke="#22d3ee"
    stroke-width="6"
    opacity="0.5"
  />

  <!-- Graduation Cap -->
  <polygon
    points="128,180 256,120 384,180 256,240"
    fill="url(#accent)"
  />

  <path
    d="M180 215 V275
       Q256 325 332 275
       V215"
    fill="none"
    stroke="#22d3ee"
    stroke-width="15"
    stroke-linecap="round"
  />

  <line
    x1="384"
    y1="180"
    x2="384"
    y2="270"
    stroke="#22d3ee"
    stroke-width="10"
    stroke-linecap="round"
  />

  <circle cx="384" cy="283" r="11" fill="#22d3ee"/>

  <!-- SC -->
  <text
    x="256"
    y="370"
    text-anchor="middle"
    font-family="Arial, sans-serif"
    font-size="105"
    font-weight="800"
    fill="#ffffff"
  >
    SC
  </text>

  <!-- 360 -->
  <text
    x="256"
    y="430"
    text-anchor="middle"
    font-family="Arial, sans-serif"
    font-size="55"
    font-weight="700"
    fill="#22d3ee"
    letter-spacing="8"
  >
    360
  </text>
</svg>